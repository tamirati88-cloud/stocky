<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>איתותים לבורסה</title>
<style>
:root{--bg:#0f1720;--card:#18222e;--line:#2a3846;--tx:#e8eef4;--mut:#8fa1b3;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#f5b942;--acc:#5aa9ff}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f9;--card:#fff;--line:#dde3ea;--tx:#17202a;--mut:#5b6b7b;--ok:#0f9d63;--bad:#d64545;--warn:#b7791f;--acc:#1f6fd1}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.row{display:flex;align-items:center;gap:8px}
h1{font-size:17px;margin:0;flex:1}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
main{padding:12px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum b{display:block;font-size:17px}
.mut{color:var(--mut);font-size:13px}
.item{cursor:pointer}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-weight:600;unicode-bidi:plaintext}
.chip{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;margin:2px 0 0 4px;border:1px solid var(--line);color:var(--mut)}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.bad{color:var(--bad);border-color:var(--bad)}.chip.warn{color:var(--warn);border-color:var(--warn)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.up,.dn,.sum b,.top>span:last-child,.chip{unicode-bidi:isolate;direction:ltr}.chip{direction:rtl}
.det{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.item.open .det{display:block}
canvas{width:100%;height:210px;display:block}
table{width:100%;border-collapse:collapse;margin-top:8px}
td{padding:3px 0;border-bottom:1px dashed var(--line);font-size:14px}td:last-child{text-align:left;direction:ltr}
.msg{padding:24px 8px;text-align:center;color:var(--mut)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px;width:min(92vw,420px)}
input{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);direction:ltr;margin:4px 0 10px}
.note{font-size:12px;color:var(--mut);margin:14px 0 4px}
.sub{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.add{display:flex;gap:8px}.add input{margin:0;flex:1}
.news{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.nw{padding:6px 0;border-bottom:1px dashed var(--line)}
.nw a{color:var(--acc);text-decoration:none;font-weight:600}
.rm{margin-top:10px;color:var(--bad);border-color:var(--bad);background:transparent}
</style>
</head>
<body>
<header>
  <div class="row"><h1>איתותים לבורסה</h1><span class="mut" id="upd"></span><button id="rf" aria-label="רענון">↻</button><button id="st" aria-label="הגדרות">⚙</button></div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"><div class="msg">טוען…</div></main>
<dialog id="dlg"><form method="dialog" id="frm">
  <b>חיבור לנתונים</b>
  <p class="mut">הדף לא מחזיק נתונים. הוא קורא אותם מהריפואים הפרטיים שלך עם טוקן ששמור רק בדפדפן הזה. לצפייה מספיק Contents: Read-only. כדי להוסיף מניות למעקב צריך גם Contents: Read and write ו-Actions: Read and write.</p>
  <label>בעל הריפו (owner)<input id="f_owner" autocomplete="off"></label>
  <label>ריפו ישראלי<input id="f_il" autocomplete="off"></label>
  <label>ריפו אמריקאי<input id="f_us" autocomplete="off"></label>
  <label>טוקן (fine-grained, Contents: Read-only)<input id="f_tok" type="password" autocomplete="off"></label>
  <div class="row"><button class="on" id="save" type="submit">שמירה</button><button type="button" id="cancel">סגירה</button></div>
</form></dialog>
<dialog id="tdlg"><form id="tfrm">
  <b>רישום עסקה</b>
  <div class="row" style="margin:10px 0"><button type="button" id="t_buy" class="on">קניתי</button><button type="button" id="t_sell">מכרתי</button></div>
  <label>סימול או מספר נייר<input id="t_tk" list="t_list" autocomplete="off" autocapitalize="characters"></label><datalist id="t_list"></datalist>
  <label>כמות<input id="t_q" inputmode="decimal" autocomplete="off"></label>
  <label><span id="t_pl">מחיר</span><input id="t_p" inputmode="decimal" autocomplete="off"></label>
  <label id="t_allw" hidden style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="t_all" style="width:auto;margin:0"> מכרתי את כל הכמות</label>
  <div class="mut" id="t_msg" style="margin:8px 0"></div>
  <div class="row"><button class="on" type="submit" id="t_ok">רשום</button><button type="button" id="t_cancel">סגירה</button></div>
</form></dialog>
<dialog id="odlg"><form id="ofrm">
  <b>פקודה שהזנתי בברוקר</b>
  <div class="row" style="margin:10px 0"><button type="button" id="o_buy" class="on">קנייה</button><button type="button" id="o_sell">מכירה</button></div>
  <label>סימול או מספר נייר<input id="o_tk" list="o_list" autocomplete="off" autocapitalize="characters"></label><datalist id="o_list"></datalist>
  <label><span id="o_pl">מחיר הפקודה</span><input id="o_p" inputmode="decimal" autocomplete="off"></label>
  <label>כמות (לא חובה)<input id="o_q" inputmode="decimal" autocomplete="off"></label>
  <div class="mut" id="o_msg" style="margin:8px 0"></div>
  <div class="row"><button class="on" type="submit" id="o_ok">שמירה</button><button type="button" id="o_cancel">סגירה</button></div>
</form></dialog>
<script>
"use strict";
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
            set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const cfg = Object.assign({owner:"tamirati88-cloud",il:"StockIL",us:"stockyAlerts",token:""}, LS.get("cfg",{}));
const MARKETS = [["il","ישראל"],["us","ארה״ב"]];
let cur = LS.get("tab","il"), sub = LS.get("sub","pf"), data = {}, errs = {}, msgs = {}, polls = {};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function gh(repo, file){
  const r = await fetch(`https://api.github.com/repos/${cfg.owner}/${repo}/contents/${file}`,
    {headers:{Authorization:"Bearer "+cfg.token, Accept:"application/vnd.github.raw+json"}, cache:"no-store"});
  if(r.status===404) return null;
  if(!r.ok) throw new Error(r.status===401||r.status===403?"הטוקן לא תקין או בלי הרשאה":"שגיאה "+r.status);
  return r.json();
}

const b64 = x => btoa(unescape(encodeURIComponent(x)));
const unb64 = x => decodeURIComponent(escape(atob(x.replace(/\n/g,""))));
async function api(repo, path, opts){
  return fetch(`https://api.github.com/repos/${cfg.owner}/${repo}/${path}`, Object.assign({cache:"no-store"}, opts||{},
    {headers:{Authorization:"Bearer "+cfg.token, Accept:"application/vnd.github+json"}}));
}
function permMsg(r){ return r.status===401?"הטוקן לא תקין": r.status===403||r.status===404?"אין הרשאת כתיבה: ערוך את הטוקן ב-GitHub והוסף Contents: Read and write ו-Actions: Read and write":"שגיאה "+r.status; }
async function readList(m){
  const r = await api(cfg[m],"contents/watchlist.json");
  if(r.status===404) return {sha:null,list:[]};
  if(!r.ok) throw new Error(permMsg(r));
  const j = await r.json(); let l=[]; try{ l=JSON.parse(unb64(j.content)).tickers||[] }catch(e){}
  return {sha:j.sha,list:l};
}
async function changeList(m, fn){
  for(let i=0;i<2;i++){
    const {sha,list} = await readList(m), nl = fn(list);
    if(nl===null) return list;
    const body = {message:"watchlist (dashboard)", content:b64(JSON.stringify({tickers:nl},null,1))}; if(sha) body.sha=sha;
    const r = await api(cfg[m],"contents/watchlist.json",{method:"PUT",body:JSON.stringify(body)});
    if(r.ok) return nl;
    if(r.status!==409 && r.status!==422) throw new Error(permMsg(r));
  }
  throw new Error("הרשימה השתנתה במקביל. נסה שוב");
}
async function dispatchWatch(m){
  const r = await api(cfg[m],"actions/workflows/"+(m==="il"?"watchlist-il":"watchlist")+".yml/dispatches",{method:"POST",body:JSON.stringify({ref:"main"})});
  if(!r.ok) throw new Error("הרשימה נשמרה, אבל הפעלת הניתוח נכשלה ("+permMsg(r)+"). הניתוח ירוץ לבד אחרי הסגירה");
}
const tmsg = {}; let tside = "buy";
const pfUnit = m => (data[m]&&data[m].dash&&data[m].dash.unit)||(m==="il"?"agorot":"usd");
async function readJson(m, file, dflt){
  const r = await api(cfg[m],"contents/"+file);
  if(r.status===404) return {sha:null,obj:dflt};
  if(!r.ok) throw new Error(permMsg(r));
  const j = await r.json(); let o=dflt; try{ o=JSON.parse(unb64(j.content)) }catch(e){}
  return {sha:j.sha,obj:o};
}
async function putJson(m, file, obj, sha, msg){
  const body = {message:msg, content:b64(JSON.stringify(obj,null,1))}; if(sha) body.sha=sha;
  return api(cfg[m],"contents/"+file,{method:"PUT",body:JSON.stringify(body)});
}
// אותה לוגיקה כמו apply_trade בבוט: ממוצע משוקלל בקנייה, ירידה בכמות במכירה, מחיקה כשהכמות מגיעה לאפס
function applyTrade(pf, log, tr){
  const pos = pf.positions||(pf.positions=[]), cur = pos.find(p=>p.ticker===tr.ticker), prev = cur?JSON.parse(JSON.stringify(cur)):null;
  const ts = new Date().toISOString().slice(0,19);
  if(tr.side==="buy"){
    if(cur){ const nq=cur.qty+tr.qty; cur.avg=Math.round((cur.qty*cur.avg+tr.qty*tr.price)/nq*1e4)/1e4; cur.qty=Math.round(nq*1e6)/1e6; }
    else pos.push({ticker:tr.ticker,qty:tr.qty,avg:tr.price});
    log.push({ts,side:"buy",ticker:tr.ticker,qty:tr.qty,price:tr.price,realized:0,prev});
    return "";
  }
  if(!cur) throw new Error("אין פוזיציה ב-"+tr.ticker+" בתיק, אי אפשר לרשום מכירה");
  const q = tr.all?cur.qty:tr.qty;
  if(q>cur.qty+1e-9) throw new Error("ב-"+tr.ticker+" יש "+cur.qty+" בלבד, אי אפשר למכור "+q);
  const realized = Math.round(q*(tr.price-cur.avg)*100)/100, left = Math.round((cur.qty-q)*1e6)/1e6;
  if(left<=1e-9) pf.positions = pos.filter(p=>p.ticker!==tr.ticker); else cur.qty = left;
  log.push({ts,side:"sell",ticker:tr.ticker,qty:q,price:tr.price,realized,prev});
  return "";
}
async function saveTrade(m, tr, undo){
  for(let i=0;i<3;i++){
    const P = await readJson(m,"portfolio.json",{positions:[]}), L = await readJson(m,"trades_log.json",[]);
    const pf = P.obj, log = Array.isArray(L.obj)?L.obj:[];
    if(undo){
      if(!log.length) throw new Error("אין עסקאות לביטול");
      const e = log.pop(); pf.positions = (pf.positions||[]).filter(p=>p.ticker!==e.ticker); if(e.prev) pf.positions.push(e.prev);
    } else applyTrade(pf, log, tr);
    const r = await putJson(m,"portfolio.json",pf,P.sha,undo?"undo last trade (dashboard)":`${tr.side} ${tr.ticker} (dashboard)`);
    if(r.status===409||r.status===422) continue;
    if(!r.ok) throw new Error(permMsg(r));
    const r2 = await putJson(m,"trades_log.json",log,L.sha,"trades log (dashboard)");
    if(!r2.ok && r2.status!==409 && r2.status!==422) throw new Error("התיק עודכן אבל יומן העסקאות לא נשמר ("+permMsg(r2)+")");
    return pf;
  }
  throw new Error("התיק השתנה במקביל. נסה שוב");
}
function patchHeld(m, pf){
  const d=data[m]; if(!d||!d.dash) return; const pos={}; (pf.positions||[]).forEach(p=>pos[p.ticker]=p);
  d.dash.tickers.forEach(t=>{ t.held = pos[t.ticker]?{qty:pos[t.ticker].qty,avg:pos[t.ticker].avg}:null; }); LS.set("d_"+m,d);
}
async function afterTrade(m, pf, text){
  patchHeld(m,pf); tmsg[m]=text+" מרענן את הניתוח, בערך 2–3 דקות."; render();
  try{
    const r = await api(cfg[m],"actions/workflows/daily-alert.yml/dispatches",{method:"POST",body:JSON.stringify({ref:"main"})});
    if(!r.ok) tmsg[m]=text+" (הפעלת העדכון נכשלה, הניתוח יתעדכן אחרי הסגירה)";
  }catch(e){ tmsg[m]=text+" (הפעלת העדכון נכשלה, הניתוח יתעדכן אחרי הסגירה)"; }
  render();
}
function openTrade(){
  const m=cur, u=pfUnit(m), held=((data[m]&&data[m].dash&&data[m].dash.tickers)||[]).filter(t=>t.held);
  $("#t_list").innerHTML = held.map(t=>`<option value="${esc(t.ticker)}">${esc(t.name||"")}</option>`).join("");
  $("#t_pl").textContent = "מחיר ליחידה ב"+(u==="agorot"?"אגורות (כמו בבורסה)":u==="ils"?"שקלים":"דולרים");
  ["t_tk","t_q","t_p"].forEach(i=>$("#"+i).value=""); $("#t_all").checked=false; $("#t_msg").textContent=""; setSide("buy"); $("#tdlg").showModal();
}
function setSide(x){ tside=x; $("#t_buy").classList.toggle("on",x==="buy"); $("#t_sell").classList.toggle("on",x==="sell"); $("#t_allw").hidden = x!=="sell"; }
$("#t_buy").onclick=()=>setSide("buy"); $("#t_sell").onclick=()=>setSide("sell"); $("#t_cancel").onclick=()=>$("#tdlg").close();
$("#t_all").onchange=()=>{ $("#t_q").disabled=$("#t_all").checked; };
$("#tfrm").onsubmit=async ev=>{
  ev.preventDefault(); const m=cur, u=pfUnit(m), msg=$("#t_msg");
  const t=normT($("#t_tk").value,m), all=tside==="sell"&&$("#t_all").checked;
  const q=parseFloat($("#t_q").value.replace(",",".")), pIn=parseFloat($("#t_p").value.replace(",","."));
  if(!/^[A-Z0-9.\-^]{1,14}$/.test(t)) return msg.textContent="סימול לא תקין";
  if(!all&&!(q>0)) return msg.textContent="יש להזין כמות";
  if(!(pIn>0)) return msg.textContent="יש להזין מחיר";
  const price = u==="agorot"?pIn/100:pIn, tr={side:tside,ticker:t,qty:all?0:q,price,all};
  $("#t_ok").disabled=true; msg.textContent="שומר…";
  try{ const pf=await saveTrade(m,tr,false); $("#tdlg").close(); await afterTrade(m,pf,(tside==="buy"?"🟢 קנייה נרשמה: ":"🔴 מכירה נרשמה: ")+t+"."); load(m,true).then(()=>{}); }
  catch(e){ msg.textContent=e.message; }
  $("#t_ok").disabled=false;
};
async function undoTrade(m){
  if(!confirm("לבטל את העסקה האחרונה?")) return;
  try{ const pf=await saveTrade(m,null,true); await afterTrade(m,pf,"↩️ העסקה האחרונה בוטלה."); }
  catch(e){ tmsg[m]=e.message; render(); }
}
let oside="buy";
function priceOf(d,t){
  const pool=[...((d.dash&&d.dash.tickers)||[]),...Object.values((d.wd&&d.wd.items)||{}),...((d.op&&d.op.items)||[])];
  const x=pool.find(a=>a.ticker===t); return x?{p:x.price,date:x.date,name:x.name}:null;
}
const ordUnit = m => pfUnit(m)==="usd"?"usd":(data[m]&&data[m].op&&data[m].op.unit)||pfUnit(m);
function ordRow(o,u,d,compact){
  const pr=priceOf(d,o.ticker), dist=pr?o.price/pr.p-1:null;
  const crossed=pr&&(o.side==="buy"?pr.p<=o.price:pr.p>=o.price), near=dist!=null&&!crossed&&Math.abs(dist)<=0.02;
  const chip=crossed?'<span class="chip bad">הגיע לפקודה, בדוק אם בוצעה</span>':near?'<span class="chip warn">קרובה</span>':"";
  const cur=pr?`${fmt(pr.p,u)} <span class="mut">(${esc((pr.date||"").slice(5))})</span>`:"אין מחיר עדכני";
  return `<div class="ordr${compact?"":" card"}"><div class="top"><span class="nm">${compact?"":esc((pr&&pr.name)||o.ticker)+" "}<span class="chip ${o.side==="buy"?"ok":"bad"}">${o.side==="buy"?"קנייה":"מכירה"}</span> ${chip}</span><button class="rm" data-odel="${esc(o.id)}" style="width:auto;padding:2px 10px">מחק</button></div>
   <div class="top mut"><span>פקודה ב-<bdi>${fmt(o.price,u)}</bdi>${o.qty?` · ${o.qty} יח׳`:""}</span><span>עכשיו ${cur}</span></div>
   <div class="top"><span class="mut">מרחק מהפקודה</span><b class="${dist==null?"":dist>=0?"up":"dn"}"><bdi>${dist==null?"–":pct(dist)}</bdi></b></div></div>`;
}
function ordHtml(m,t){
  const d=data[m]; if(!d) return ""; const u=ordUnit(m), os=(d.od||[]).filter(o=>o.ticker===t);
  return `<div class="news"><b>פקודות</b>${os.length?os.map(o=>ordRow(o,u,d,true)).join(""):'<div class="mut">אין פקודות לנייר הזה.</div>'}<div style="margin-top:8px"><button data-ord="${esc(t)}">➕ הוסף פקודה</button></div></div>`;
}
function odView(m,d){
  const u=ordUnit(m), os=[...(d.od||[])].sort((a,b)=>{const pa=priceOf(d,a.ticker),pb=priceOf(d,b.ticker);
    const da=pa?Math.abs(a.price/pa.p-1):9, db=pb?Math.abs(b.price/pb.p-1):9; return da-db;});
  return `<div class="card"><div class="row"><button class="on" id="o_new">➕ פקודה חדשה</button></div><div class="note">המערכת לא מתחברת לברוקר. הפקודות נשמרות כאן כתזכורת, והמרחק מחושב מהמחיר של הסגירה האחרונה.</div></div>`+
    (os.length?`<div class="mut" style="margin:4px 4px 8px">מסודר לפי הקרבה למחיר העדכני · ${os.length}</div>`+os.map(o=>ordRow(o,u,d,false)).join(""):'<div class="msg">עוד לא הוספת פקודות</div>');
}
function openOrder(t){
  const m=cur, u=ordUnit(m), d=data[m]||{};
  const pool=[...((d.dash&&d.dash.tickers)||[]),...Object.values((d.wd&&d.wd.items)||{}),...((d.op&&d.op.items)||[])], seen={};
  $("#o_list").innerHTML=pool.filter(x=>!seen[x.ticker]&&(seen[x.ticker]=1)).map(x=>`<option value="${esc(x.ticker)}">${esc(x.name||"")}</option>`).join("");
  $("#o_pl").textContent="מחיר הפקודה ב"+(u==="agorot"?"אגורות (כמו בבורסה)":u==="ils"?"שקלים":"דולרים");
  $("#o_tk").value=t||""; $("#o_p").value=""; $("#o_q").value=""; $("#o_msg").textContent=""; setOSide("buy"); $("#odlg").showModal();
}
function setOSide(x){ oside=x; $("#o_buy").classList.toggle("on",x==="buy"); $("#o_sell").classList.toggle("on",x==="sell"); }
async function changeOrders(m, fn){
  for(let i=0;i<3;i++){
    const R=await readJson(m,"orders.json",[]), list=Array.isArray(R.obj)?R.obj:[], nl=fn(list);
    const r=await putJson(m,"orders.json",nl,R.sha,"orders (dashboard)");
    if(r.ok) return nl;
    if(r.status!==409&&r.status!==422) throw new Error(permMsg(r));
  }
  throw new Error("הרשימה השתנתה במקביל. נסה שוב");
}

  const rank=t=>(t.pending.length?0:t.flags.length?1:t.kind?2:3);
  const sorted=[...held].sort((a,b)=>rank(a)-rank(b));
  const rest=T.filter(t=>!t.held&&(t.pending.length||t.kind)).sort((a,b)=>rank(a)-rank(b));
  main.innerHTML = warn+subs+
   tbar+(held.length?`<div class="card sum"><div class="mut">שווי<b>${fmt(val,u==="agorot"?"ils":u)}</b></div><div class="mut">עלות<b>${fmt(cost,u==="agorot"?"ils":u)}</b></div><div class="mut">רווח<b class="${sgn(val/cost-1)}">${pct(val/cost-1)}</b></div></div>`:"")+
   (sorted.length?`<div class="mut" style="margin:4px 4px 8px">אחזקות (${sorted.length})</div>`+sorted.map(t=>item(t,u,al[t.ticker],newsFor(d,t.ticker))).join(""):"")+
   (rest.length?`<div class="mut" style="margin:14px 4px 8px">ברשימת מעקב: קרובות לקו או עם איתות</div>`+rest.map(t=>item(t,u,al[t.ticker],newsFor(d,t.ticker))).join(""):"")+
   `<div class="note">הנתונים נטענים מהריפואים שלך ומתעדכנים אחרי הסגירה; התראות תוך-יומיות מופיעות עם ⚡.${held.some(t=>t.proxied)?" ערכים עם 'הערכה לפי מדד' אינם מחיר אמיתי.":""}</div>`;
}
document.addEventListener("click",ev=>{
  const tb=ev.target.closest("[data-m]"); if(tb){cur=tb.dataset.m; LS.set("tab",cur); load(cur).then(render); render(); return;}
  const sb=ev.target.closest("[data-s]"); if(sb){sub=sb.dataset.s; LS.set("sub",sub); render(); return;}
  if(ev.target.closest("#w_add")){ addWatch(cur); return; }
  if(ev.target.closest("#t_open")){ openTrade(); return; }
  if(ev.target.closest("#o_new")){ openOrder(""); return; }
  const oa=ev.target.closest("[data-ord]"); if(oa){ openOrder(oa.dataset.ord); return; }
  const od_=ev.target.closest("[data-odel]"); if(od_){ delOrder(cur,od_.dataset.odel); return; }
  if(ev.target.closest("#t_undo")){ undoTrade(cur); return; }
  const rm=ev.target.closest("[data-rm]"); if(rm){
    if(rm.dataset.sure){ removeWatch(cur,rm.dataset.rm); } else { rm.dataset.sure="1"; rm.textContent="לחץ שוב לאישור הסרה"; }
    return; }
  if(ev.target.closest("a,input,button")) return;
  const it=ev.target.closest(".item"); if(it){ it.classList.toggle("open"); if(it.classList.contains("open")) drawOpen(); }
});
document.addEventListener("keydown",ev=>{ if(ev.key==="Enter"&&ev.target.id==="w_in") addWatch(cur); });
function openCfg(){ $("#f_owner").value=cfg.owner; $("#f_il").value=cfg.il; $("#f_us").value=cfg.us; $("#f_tok").value=cfg.token; $("#dlg").showModal(); }
$("#st").onclick=openCfg; $("#cancel").onclick=()=>$("#dlg").close();
$("#frm").onsubmit=()=>{ Object.assign(cfg,{owner:$("#f_owner").value.trim(),il:$("#f_il").value.trim(),us:$("#f_us").value.trim(),token:$("#f_tok").value.trim()}); LS.set("cfg",cfg); data={}; errs={}; load(cur,true).then(render); };
$("#rf").onclick=()=>{ $("#main").innerHTML='<div class="msg">טוען…</div>'; load(cur,true).then(render); };
(async()=>{ if(!cfg.token){ render(); openCfg(); } else { await load(cur); render(); }
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{}); })();
</script>
</body>
